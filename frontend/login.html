<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso al inventario de lotes de café de Finca Monte Nublado.">
  <title>Iniciar sesión | Finca Monte Nublado</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina-login">
  <aside class="login-portada" aria-hidden="true">
    <img class="login-portada-img" src="img/hero-cafetal.svg" alt="">
    <blockquote>
      <p>Cada lote, desde la parcela hasta la bodega.</p>
    </blockquote>
  </aside>

  <main class="login-panel">
    <a class="marca" href="./">
      <img src="img/logo.svg" alt="" width="44" height="44">
      <span>Finca Monte Nublado</span>
    </a>

    <div class="login-contenido">
      <h1 id="titulo">Inicia sesión</h1>
      <p class="login-subtitulo" id="subtitulo">Entra para registrar y editar los lotes de café.</p>

      <div class="aviso aviso-error" id="aviso" role="alert" hidden></div>

      <form id="formulario" novalidate>
        <div class="campo" id="campo-nombre" hidden>
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="80">
          <p class="campo-error" data-error="nombre"></p>
        </div>

        <div class="campo">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="username" inputmode="email" required>
          <p class="campo-error" data-error="correo"></p>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="campo-password">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="boton-ver" id="ver-password" type="button" aria-pressed="false">Mostrar</button>
          </div>
          <p class="campo-ayuda" id="ayuda-password" hidden>Mínimo 8 caracteres.</p>
          <p class="campo-error" data-error="password"></p>
        </div>

        <button class="boton boton-primario boton-ancho" id="enviar" type="submit">Iniciar sesión</button>
      </form>

      <p class="login-cambio">
        <span id="cambio-texto">¿Aún no tienes cuenta?</span>
        <button class="boton-enlace" id="cambiar-modo" type="button">Crear una cuenta</button>
      </p>
      <p class="login-cambio"><a href="./">Ver el inventario sin iniciar sesión</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
